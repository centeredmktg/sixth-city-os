<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:22px 24px;}
  .row{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
  .sw{flex:1;height:64px;}
  .scale{display:flex;margin-top:10px;}
  .cell{flex:1;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);text-align:center;}
  .cell b{display:block;color:var(--text-secondary);font-weight:500;}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--neutral-0)"></div>
    <div class="sw" style="background:var(--neutral-50)"></div>
    <div class="sw" style="background:var(--neutral-100)"></div>
    <div class="sw" style="background:var(--neutral-200)"></div>
    <div class="sw" style="background:var(--neutral-300)"></div>
    <div class="sw" style="background:var(--neutral-400)"></div>
    <div class="sw" style="background:var(--neutral-500)"></div>
    <div class="sw" style="background:var(--neutral-600)"></div>
    <div class="sw" style="background:var(--neutral-700)"></div>
    <div class="sw" style="background:var(--neutral-800)"></div>
    <div class="sw" style="background:var(--neutral-900)"></div>
    <div class="sw" style="background:var(--neutral-950)"></div>
  </div>
  <div class="scale">
    <div class="cell"><b>0</b>fff</div>
    <div class="cell"><b>50</b>f7f6f2</div>
    <div class="cell"><b>100</b>efece6</div>
    <div class="cell"><b>200</b>e1ddd4</div>
    <div class="cell"><b>300</b>ccc6ba</div>
    <div class="cell"><b>400</b>a79f92</div>
    <div class="cell"><b>500</b>847b6e</div>
    <div class="cell"><b>600</b>645c51</div>
    <div class="cell"><b>700</b>49443c</div>
    <div class="cell"><b>800</b>2e2b25</div>
    <div class="cell"><b>900</b>1a1815</div>
    <div class="cell"><b>950</b>0e0d0b</div>
  </div>
</body>
</html>
