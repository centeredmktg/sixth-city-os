<!-- @dsCard group="Colors" viewport="760x150" name="Brand — teal / forest green" subtitle="The identity scale. --teal-600 is primary." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:22px 24px;}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:64px;}
  .scale{display:flex;gap:0;margin-top:10px;}
  .cell{flex:1;font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);text-align:center;}
  .cell b{display:block;color:var(--text-secondary);font-weight:500;}
  .star b{color:var(--brand) !important;}
  .star b::after{content:" \2022 primary";font-size:8.5px;letter-spacing:.04em;}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--teal-50)"></div>
    <div class="sw" style="background:var(--teal-100)"></div>
    <div class="sw" style="background:var(--teal-200)"></div>
    <div class="sw" style="background:var(--teal-300)"></div>
    <div class="sw" style="background:var(--teal-400)"></div>
    <div class="sw" style="background:var(--teal-500)"></div>
    <div class="sw" style="background:var(--teal-600)"></div>
    <div class="sw" style="background:var(--teal-700)"></div>
    <div class="sw" style="background:var(--teal-800)"></div>
    <div class="sw" style="background:var(--teal-900)"></div>
    <div class="sw" style="background:var(--teal-950)"></div>
  </div>
  <div class="scale">
    <div class="cell"><b>50</b>eff6f3</div>
    <div class="cell"><b>100</b>dcebe6</div>
    <div class="cell"><b>200</b>b3d4cc</div>
    <div class="cell"><b>300</b>7bb3a6</div>
    <div class="cell"><b>400</b>4a9082</div>
    <div class="cell"><b>500</b>2e7566</div>
    <div class="cell star"><b>600</b>236054</div>
    <div class="cell"><b>700</b>1b4d43</div>
    <div class="cell"><b>800</b>143b33</div>
    <div class="cell"><b>900</b>0e2d27</div>
    <div class="cell"><b>950</b>08201b</div>
  </div>
</body>
</html>
