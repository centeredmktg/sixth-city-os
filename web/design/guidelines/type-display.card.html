<!-- @dsCard group="Type" viewport="760x200" name="Display — Newsreader serif" subtitle="Editorial headlines & pull quotes. The brand's soul." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:26px 28px;}
  .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;}
  .display{font-family:var(--font-serif);font-weight:500;font-size:46px;line-height:var(--leading-tight);letter-spacing:var(--tracking-tight);color:var(--text-primary);margin:0;max-width:18ch;}
  .quote{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:20px;line-height:var(--leading-snug);color:var(--text-secondary);margin:16px 0 0;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:14px;}
</style>
</head>
<body>
  <div class="eyebrow">Newsreader · 400 / 500 · italic</div>
  <h2 class="display">Building a world where candid feedback fuels growth.</h2>
  <p class="quote">“Insight without operationalization rarely leads to lasting change.”</p>
  <div class="meta">--font-serif · --display-font</div>
</body>
</html>
