<!-- @dsCard group="Colors" viewport="760x190" name="Semantic roles in use" subtitle="surface, text, border, brand aliases applied" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);padding:22px 24px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);}
  .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);}
  h4{margin:6px 0 4px;font-size:16px;color:var(--text-primary);}
  p{margin:0;font-size:13px;color:var(--text-secondary);line-height:var(--leading-normal);}
  .row{display:flex;gap:8px;margin-top:12px;align-items:center;}
  .btn{font-family:var(--font-sans);font-size:13px;font-weight:600;border-radius:var(--radius-md);padding:8px 14px;border:0;cursor:default;}
  .pri{background:var(--brand);color:var(--on-brand);}
  .sub{background:var(--brand-subtle);color:var(--text-brand);}
  .dark{background:var(--surface-dark);border-color:transparent;color:var(--text-inverse);}
  .dark .eyebrow{color:rgba(255,255,255,.5);}
  .dark h4{color:#fff;}
  .dark p{color:rgba(255,255,255,.7);}
  .pill{display:inline-block;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--radius-full);padding:3px 9px;}
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <span class="eyebrow">surface · light</span>
      <h4>Growth Guide ready</h4>
      <p>Insight, operationalized. Text uses --text-primary over --surface with a hairline --border.</p>
      <div class="row"><button class="btn pri">Primary</button><button class="btn sub">Subtle</button><span class="pill">--border</span></div>
    </div>
    <div class="card dark">
      <span class="eyebrow">surface · dark</span>
      <h4>Where growth is intentional</h4>
      <p>--surface-dark with --text-inverse. Dark panels carry the brand's editorial gravity.</p>
      <div class="row"><button class="btn pri">Start your 360</button></div>
    </div>
  </div>
</body>
</html>
