<!-- @dsCard group="Spacing" viewport="760x170" name="Shadows" subtitle="Warm, soft, low-contrast elevation — xs → xl + brand" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);padding:30px 28px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;gap:12px;align-items:center;}
  .box{width:84px;height:56px;background:var(--surface);border-radius:var(--radius-md);}
  .brand{background:var(--brand);}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);}
</style>
</head>
<body>
  <div class="item"><span class="box" style="box-shadow:var(--shadow-xs)"></span><span class="tag">xs</span></div>
  <div class="item"><span class="box" style="box-shadow:var(--shadow-sm)"></span><span class="tag">sm</span></div>
  <div class="item"><span class="box" style="box-shadow:var(--shadow-md)"></span><span class="tag">md</span></div>
  <div class="item"><span class="box" style="box-shadow:var(--shadow-lg)"></span><span class="tag">lg</span></div>
  <div class="item"><span class="box" style="box-shadow:var(--shadow-xl)"></span><span class="tag">xl</span></div>
  <div class="item"><span class="box brand" style="box-shadow:var(--shadow-brand)"></span><span class="tag">brand</span></div>
</body>
</html>
