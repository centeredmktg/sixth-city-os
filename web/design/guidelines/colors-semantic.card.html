<!-- @dsCard group="Colors" viewport="760x180" name="Accent & semantic" subtitle="Gold accent (sparingly) + success / warning / danger / info" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:22px 24px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}
  .stack{display:flex;flex-direction:column;gap:6px;}
  .chip{height:46px;border-radius:var(--radius-sm);box-shadow:var(--shadow-xs);}
  .tint{height:18px;border-radius:6px;}
  .name{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);}
  .hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);}
</style>
</head>
<body>
  <div class="grid">
    <div class="stack"><div class="chip" style="background:var(--gold-500)"></div><div class="tint" style="background:var(--gold-100)"></div><span class="name">accent · gold</span><span class="hex">c79f5a / f5ecd9</span></div>
    <div class="stack"><div class="chip" style="background:var(--success-600)"></div><div class="tint" style="background:var(--success-100)"></div><span class="name">success</span><span class="hex">2c8a58 / e0f0e7</span></div>
    <div class="stack"><div class="chip" style="background:var(--warning-600)"></div><div class="tint" style="background:var(--warning-100)"></div><span class="name">warning</span><span class="hex">bd7d2a / f7ecd6</span></div>
    <div class="stack"><div class="chip" style="background:var(--danger-600)"></div><div class="tint" style="background:var(--danger-100)"></div><span class="name">danger</span><span class="hex">b34a3c / f6e3df</span></div>
    <div class="stack"><div class="chip" style="background:var(--info-600)"></div><div class="tint" style="background:var(--info-100)"></div><span class="name">info</span><span class="hex">2f718f / e1eef4</span></div>
  </div>
</body>
</html>
