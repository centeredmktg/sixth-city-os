<!-- @dsCard group="Spacing" viewport="760x150" name="Spacing scale" subtitle="4px base — 1 through 32" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:24px 28px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .item{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
  .bar{background:var(--gradient-brand);border-radius:var(--radius-xs);height:18px;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);}
  .px{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><span class="bar" style="width:var(--space-1)"></span><span class="tag">1</span><span class="px">4</span></div>
    <div class="item"><span class="bar" style="width:var(--space-2)"></span><span class="tag">2</span><span class="px">8</span></div>
    <div class="item"><span class="bar" style="width:var(--space-3)"></span><span class="tag">3</span><span class="px">12</span></div>
    <div class="item"><span class="bar" style="width:var(--space-4)"></span><span class="tag">4</span><span class="px">16</span></div>
    <div class="item"><span class="bar" style="width:var(--space-6)"></span><span class="tag">6</span><span class="px">24</span></div>
    <div class="item"><span class="bar" style="width:var(--space-8)"></span><span class="tag">8</span><span class="px">32</span></div>
    <div class="item"><span class="bar" style="width:var(--space-12)"></span><span class="tag">12</span><span class="px">48</span></div>
    <div class="item"><span class="bar" style="width:var(--space-16)"></span><span class="tag">16</span><span class="px">64</span></div>
    <div class="item"><span class="bar" style="width:var(--space-24)"></span><span class="tag">24</span><span class="px">96</span></div>
  </div>
</body>
</html>
