<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:22px 24px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .stack{display:flex;flex-direction:column;gap:8px;}
  .g{height:78px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
  .ring{display:grid;place-items:center;}
  .ring i{width:64px;height:64px;border-radius:50%;background:var(--gradient-brand-ring);
    -webkit-mask:radial-gradient(circle 19px at 50% 50%, transparent 98%, #000 100%);
    mask:radial-gradient(circle 19px at 50% 50%, transparent 98%, #000 100%);}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);}
</style>
</head>
<body>
  <div class="grid">
    <div class="stack"><div class="g" style="background:var(--gradient-brand)"></div><span class="lbl">--gradient-brand</span></div>
    <div class="stack"><div class="g" style="background:var(--gradient-dark)"></div><span class="lbl">--gradient-dark</span></div>
    <div class="stack"><div class="g" style="background:var(--gradient-brand-soft)"></div><span class="lbl">--gradient-brand-soft</span></div>
    <div class="stack"><div class="g ring" style="background:var(--surface-sunken)"><i></i></div><span class="lbl">--gradient-brand-ring</span></div>
  </div>
</body>
</html>
