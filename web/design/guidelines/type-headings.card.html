<!-- @dsCard group="Type" viewport="760x210" name="Headings — Hanken Grotesk" subtitle="UI & product headings. Geometric-humanist sans." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:24px 28px;}
  .item{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid var(--divider);}
  .item:last-child{border-bottom:0;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:130px;flex:none;}
  .s1{font-size:32px;font-weight:700;letter-spacing:var(--tracking-tight);}
  .s2{font-size:24px;font-weight:600;letter-spacing:var(--tracking-snug);}
  .s3{font-size:20px;font-weight:600;}
  .s4{font-size:16px;font-weight:600;}
</style>
</head>
<body>
  <div class="item"><span class="tag">2xl · 700</span><span class="s1">Launch a 360 in minutes</span></div>
  <div class="item"><span class="tag">xl · 600</span><span class="s2">Your growth, made actionable</span></div>
  <div class="item"><span class="tag">lg · 600</span><span class="s3">Strengths & blind spots</span></div>
  <div class="item"><span class="tag">base · 600</span><span class="s4">Invite your respondents</span></div>
</body>
</html>
