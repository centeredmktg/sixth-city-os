<!-- @dsCard group="Spacing" viewport="760x150" name="Motion & easing" subtitle="Calm, confident. ease-out for entrances, no bounce." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:22px 28px;}
  .track{display:flex;flex-direction:column;gap:10px;}
  .lane{display:flex;align-items:center;gap:12px;}
  .name{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);width:150px;flex:none;}
  .rail{position:relative;flex:1;height:14px;background:var(--surface-sunken);border-radius:var(--radius-full);overflow:hidden;}
  .dot{position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:var(--brand);}
  .a1{animation:run 2.4s var(--ease-out) infinite alternate;}
  .a2{animation:run 2.4s var(--ease-soft) infinite alternate;}
  .a3{animation:run 2.4s linear infinite alternate;}
  @keyframes run{from{left:1px}to{left:calc(100% - 13px)}}
  @media (prefers-reduced-motion: reduce){.dot{animation:none;left:calc(50% - 6px)}}
</style>
</head>
<body>
  <div class="track">
    <div class="lane"><span class="name">--ease-out · 220ms</span><span class="rail"><span class="dot a1"></span></span></div>
    <div class="lane"><span class="name">--ease-soft · 360ms</span><span class="rail"><span class="dot a2"></span></span></div>
    <div class="lane"><span class="name">linear (avoid)</span><span class="rail"><span class="dot a3" style="background:var(--neutral-400)"></span></span></div>
  </div>
</body>
</html>
