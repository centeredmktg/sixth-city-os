<!-- @dsCard group="Type" viewport="760x220" name="Type scale" subtitle="xs → 5xl ramp, in sans" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--surface);color:var(--text-primary);padding:20px 28px;}
  .item{display:flex;align-items:baseline;gap:16px;padding:3px 0;}
  .tag{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);width:96px;flex:none;}
  .sample{color:var(--text-primary);letter-spacing:var(--tracking-tight);font-weight:600;white-space:nowrap;line-height:1.15;}
</style>
</head>
<body>
  <div class="item"><span class="tag">5xl · 68</span><span class="sample" style="font-size:42px">Grow</span></div>
  <div class="item"><span class="tag">3xl · 40</span><span class="sample" style="font-size:32px">Grow with candor</span></div>
  <div class="item"><span class="tag">2xl · 32</span><span class="sample" style="font-size:26px">Grow with candor</span></div>
  <div class="item"><span class="tag">xl · 24</span><span class="sample" style="font-size:21px;font-weight:500">Grow with candor</span></div>
  <div class="item"><span class="tag">lg · 20</span><span class="sample" style="font-size:18px;font-weight:500">Grow with candor and clarity</span></div>
  <div class="item"><span class="tag">base · 16</span><span class="sample" style="font-size:15px;font-weight:400">Grow with candor and clarity</span></div>
  <div class="item"><span class="tag">sm · 14 / xs · 12</span><span class="sample" style="font-size:13px;font-weight:400">Grow with candor and clarity, every quarter</span></div>
</body>
</html>
