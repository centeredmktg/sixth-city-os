<!-- @dsCard group="Components" viewport="760x620" name="Forms" subtitle="Buttons, inputs, selection controls & the 360 rating scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);padding:26px;}
  .grp{margin-bottom:26px;}
  .h{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;
     color:var(--text-muted);margin-bottom:12px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
     padding:18px;box-shadow:var(--shadow-sm);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Input, Textarea, Select, Checkbox, Radio, Switch, RatingScale } = window.Ds360GrowthDesignSystem_39b0a1;

function Icon({ name, size = 18 }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const i = document.createElement('i'); i.setAttribute('data-lucide', name);
      ref.current.appendChild(i);
      window.lucide.createIcons({ attrs: { 'stroke-width': 1.75, width: size, height: size } });
    }
  });
  return <span ref={ref} style={{ display: 'inline-flex' }} />;
}

function Demo() {
  const [rating, setRating] = React.useState(4);
  const [on, setOn] = React.useState(true);
  const [chk, setChk] = React.useState(true);
  return (
    <div>
      <div className="grp">
        <div className="h">Buttons</div>
        <div className="row">
          <Button>Start your 360</Button>
          <Button variant="secondary">Save draft</Button>
          <Button variant="subtle">Invite</Button>
          <Button variant="ghost" iconRight={<Icon name="arrow-right" size={16} />}>Learn more</Button>
          <Button variant="danger">Close 360</Button>
        </div>
        <div className="row">
          <Button size="sm">Small</Button>
          <Button size="lg" iconLeft={<Icon name="sparkles" size={18} />}>Generate guide</Button>
          <Button disabled>Disabled</Button>
          <IconButton label="More" variant="outline"><Icon name="more-horizontal" /></IconButton>
          <IconButton label="Add" variant="solid"><Icon name="plus" /></IconButton>
          <IconButton label="Settings" variant="ghost"><Icon name="settings" /></IconButton>
        </div>
      </div>

      <div className="grp">
        <div className="h">Text fields</div>
        <div className="cols">
          <Input label="Work email" type="email" placeholder="you@company.com" iconLeft={<Icon name="mail" size={16} />} />
          <Select label="Relationship" placeholder="Choose one"
            options={[{value:'peer',label:'Peer'},{value:'report',label:'Direct report'},{value:'manager',label:'Manager'}]} />
        </div>
        <div style={{ marginTop: 14 }}>
          <Textarea label="What should they keep doing?" placeholder="Be specific…" maxLength={280} value={"They create real psychological safety in every meeting."} onChange={()=>{}} />
        </div>
      </div>

      <div className="grp">
        <div className="h">Selection</div>
        <div className="cols">
          <div className="panel" style={{ display:'flex', flexDirection:'column', gap:12 }}>
            <Checkbox label="Keep responses anonymous" description="Recommended for candor" checked={chk} onChange={e=>setChk(e.target.checked)} />
            <Switch label="Send weekly reminders" checked={on} onChange={e=>setOn(e.target.checked)} />
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            <Radio name="who" label="I'm a coach" description="Run 360s for clients" card defaultChecked />
            <Radio name="who" label="We're a team" description="For our whole org" card />
          </div>
        </div>
      </div>

      <div className="grp" style={{ marginBottom: 0 }}>
        <div className="h">Rating scale · the 360 survey input</div>
        <div className="panel">
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 12 }}>They give clear, candid feedback.</div>
          <RatingScale value={rating} onChange={setRating} minLabel="Rarely" maxLabel="Consistently" allowNA />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
