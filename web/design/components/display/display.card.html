<!-- @dsCard group="Components" viewport="760x640" name="Display" subtitle="Cards, score rings, badges, tags, avatars, stats & progress" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);padding:26px;}
  .grp{margin-bottom:24px;}
  .h{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-caps);text-transform:uppercase;
     color:var(--text-muted);margin-bottom:12px;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .title{font-size:15px;font-weight:600;margin:0 0 4px;}
  .sub{font-size:12.5px;color:var(--text-secondary);margin:0;line-height:1.4;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Card, Badge, Tag, Avatar, AvatarGroup, ScoreRing, ProgressBar, Stat } = window.Ds360GrowthDesignSystem_39b0a1;

function Demo() {
  return (
    <div>
      <div className="grp">
        <div className="h">Score rings · the 360 motif</div>
        <Card padded>
          <div className="row" style={{ justifyContent: 'space-around' }}>
            <ScoreRing value={4.6} max={5} caption="overall" label="Overall" size={132} />
            <ScoreRing value={4.1} max={5} caption="growth" label="Self-awareness" tone="gold" size={108} />
            <ScoreRing value={92} max={100} format={v=>`${v}%`} caption="complete" label="Responses" tone="success" size={108} />
          </div>
        </Card>
      </div>

      <div className="grp">
        <div className="h">Cards</div>
        <div className="cards3">
          <Card><p className="title">Default</p><p className="sub">White surface, hairline border, soft shadow.</p></Card>
          <Card tone="dark"><p className="title" style={{color:'#fff'}}>Editorial</p><p className="sub" style={{color:'rgba(255,255,255,.7)'}}>Near-black gradient for gravity.</p></Card>
          <Card tone="brand"><p className="title" style={{color:'#fff'}}>Highlight</p><p className="sub" style={{color:'rgba(255,255,255,.82)'}}>Teal gradient for key moments.</p></Card>
        </div>
      </div>

      <div className="grp">
        <div className="h">Badges & tags</div>
        <div className="row" style={{ marginBottom: 12 }}>
          <Badge tone="success" dot>Complete</Badge>
          <Badge tone="warning" dot>In progress</Badge>
          <Badge tone="danger" dot>Overdue</Badge>
          <Badge tone="brand">AI Growth Guide</Badge>
          <Badge tone="gold">Recommended</Badge>
          <Badge tone="outline">Draft</Badge>
        </div>
        <div className="row">
          <Tag selected onClick={()=>{}}>Communication</Tag>
          <Tag onClick={()=>{}}>Delegation</Tag>
          <Tag onClick={()=>{}}>Vision</Tag>
          <Tag onRemove={()=>{}}>jordan@acme.com</Tag>
        </div>
      </div>

      <div className="grp">
        <div className="h">Avatars</div>
        <div className="row">
          <Avatar name="Andrew Horn" />
          <Avatar name="Michael Galpert" size="lg" ring />
          <Avatar name="Sam Roe" muted />
          <AvatarGroup people={[{name:'Ana Reed'},{name:'Jon Diaz'},{name:'Mia Lee'},{name:'Sam Roe'},{name:'Ko Park'}]} max={3} />
        </div>
      </div>

      <div className="grp" style={{ marginBottom: 0 }}>
        <div className="h">Stats & progress</div>
        <Card padded>
          <div className="stats" style={{ marginBottom: 18 }}>
            <Stat label="Overall score" value="4.6" unit="/5" delta="+0.4" deltaDir="up" />
            <Stat label="Respondents" value={9} delta={2} />
            <Stat label="Avg. candor" value="High" deltaDir="flat" delta="steady" />
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            <ProgressBar value={7} max={10} label="Responses collected" showValue format={(v,m)=>`${v}/${m}`} />
            <ProgressBar value={82} tone="gold" label="Profile complete" showValue />
          </div>
        </Card>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
