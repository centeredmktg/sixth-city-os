<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ingestion Engine — Sixth City Marketing</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="ds/styles.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--surface-page); }
  #pe-root { height: 100vh; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink-700); z-index: 100; transition: opacity .3s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot img { width: 168px; opacity: .9; }

  .pe-app{ display:grid; grid-template-columns:236px 1fr; height:100vh; overflow:hidden; background:var(--surface-page); }
  .pe-side{ background:var(--ink-700); color:var(--cream); display:flex; flex-direction:column; min-height:0; border-right:1px solid rgba(0,0,0,.2); }
  .pe-side__brand{ padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,.09); }
  .pe-side__logo{ width:138px; display:block; margin-bottom:12px; }
  .pe-side__product{ display:flex; align-items:center; gap:7px; }
  .pe-side__product .scm-overline{ color:var(--orange-400); font-size:11px; letter-spacing:.16em; font-family:var(--font-condensed); font-weight:700; text-transform:uppercase; }
  .pe-side__product svg{ color:var(--orange-400); }
  .pe-side__nav{ padding:14px 12px; display:flex; flex-direction:column; gap:3px; flex:1; min-height:0; overflow:auto; }
  .pe-side__label{ font-family:var(--font-condensed); text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:rgba(255,255,255,.42); font-weight:700; padding:14px 12px 6px; }
  .pe-nav{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-md); color:rgba(255,255,255,.74); font-weight:700; font-size:var(--text-md); cursor:pointer; position:relative; border:none; background:transparent; width:100%; text-align:left; font-family:var(--font-sans); transition:background var(--tap-transition), color var(--tap-transition); }
  .pe-nav:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .pe-nav svg{ flex:none; opacity:.9; }
  .pe-nav__count{ margin-left:auto; font-family:var(--font-mono); font-size:var(--text-xs); font-weight:600; background:rgba(255,255,255,.12); color:rgba(255,255,255,.85); padding:1px 7px; border-radius:var(--radius-pill); }
  .pe-nav--on{ background:var(--coral-500); color:#fff; }
  .pe-nav--on:hover{ background:var(--coral-500); }
  .pe-nav--on svg{ opacity:1; }
  .pe-nav--on .pe-nav__count{ background:rgba(0,0,0,.22); color:#fff; }
  .pe-side__foot{ border-top:1px solid rgba(255,255,255,.09); padding:12px; }
  .pe-who{ display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:var(--radius-md); }
  .pe-who__name{ font-weight:800; font-size:var(--text-sm); color:#fff; line-height:1.2; }
  .pe-who__role{ font-size:var(--text-xs); color:rgba(255,255,255,.6); }

  .pe-main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
  .pe-top{ height:64px; flex:none; background:var(--surface-card); border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; gap:16px; padding:0 28px; }
  .pe-top__title{ font-family:var(--font-display); font-weight:900; font-size:var(--text-xl); letter-spacing:var(--ls-tight); color:var(--text-strong); line-height:1.1; }
  .pe-top__sub{ font-size:var(--text-sm); color:var(--text-muted); margin-top:1px; }
  .pe-top__spacer{ flex:1; }
  .pe-top__search{ display:flex; align-items:center; gap:8px; height:38px; padding:0 12px; min-width:230px; background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-md); color:var(--text-subtle); font-size:var(--text-sm); }
  .pe-top__search input{ border:none; background:transparent; outline:none; font-family:var(--font-sans); font-size:var(--text-sm); color:var(--text-body); width:100%; }
  .pe-iconbtn{ width:38px; height:38px; display:grid; place-items:center; border-radius:var(--radius-md); border:1px solid var(--border-subtle); background:var(--surface-card); color:var(--text-muted); cursor:pointer; position:relative; transition:background var(--tap-transition); }
  .pe-iconbtn:hover{ background:var(--surface-sunken); color:var(--text-body); }
  .pe-iconbtn__dot{ position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--coral-500); border:2px solid var(--surface-card); }
  .pe-scroll{ flex:1; min-height:0; overflow:auto; }
  .pe-page{ max-width:1240px; margin:0 auto; padding:28px 28px 120px; }
  .pe-overline{ font-family:var(--font-condensed); font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:var(--text-xs); color:var(--text-subtle); }
  .pe-mono{ font-family:var(--font-mono); }
  .q-head{ display:flex; align-items:flex-start; gap:16px; }
  .q-head h2{ font-family:var(--font-display); font-weight:900; font-size:var(--text-3xl); letter-spacing:var(--ls-tight); color:var(--text-strong); line-height:1.04; }
  .q-head p{ font-size:var(--text-md); line-height:1.5; }
</style>
</head>
<body>
<div id="boot"><img src="ds/assets/logo-knockout.png" alt="Sixth City Marketing" /></div>
<div id="pe-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Guard: the DS bundle embeds the marketing-site kit, which auto-mounts into
     #root. We render into #pe-root, so neutralize any stray createRoot. -->
<script>
(function () {
  const real = ReactDOM.createRoot.bind(ReactDOM);
  const noop = { render() {}, unmount() {} };
  ReactDOM.createRoot = function (container) {
    if (!container || container.id === "root") return noop;
    return real(container);
  };
})();
</script>

<script src="ds/_ds_bundle.js"></script>

<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/ingestion.jsx"></script>
<script type="text/babel" src="app/importer.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>

<script>
  (function () {
    const boot = document.getElementById("boot");
    const root = document.getElementById("pe-root");
    const mounted = new Promise((res) => {
      const obs = new MutationObserver(() => {
        if (root.childElementCount > 0) { obs.disconnect(); res(); }
      });
      obs.observe(root, { childList: true });
    });
    const fonts = (document.fonts && document.fonts.ready) || Promise.resolve();
    const done = () => { boot.classList.add("gone"); setTimeout(() => boot.remove(), 400); };
    Promise.all([mounted, fonts]).then(done);
    setTimeout(done, 6000);
  })();
</script>
</body>
</html>
